name: Bug report
description: Tell us what went wrong
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for making LifeOS better. Do not attach a real data backup.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps needed to reproduce it.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
